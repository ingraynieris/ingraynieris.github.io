<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ÜBERMENSCH | OVERRIDE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ffcc; --bg: #040209; --pink: #ff007f; --gold: #FFD700; --glass: rgba(10, 5, 20, 0.7); --glitch: rgba(0, 255, 204, 0.2); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(circle at 50% 50%, #1a0a2e 0%, #040209 70%, #000 100%); color: #fff; font-family: 'Share Tech Mono', monospace; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .page-grid { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; max-width: 900px; }
        .hud-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 30px; padding: 25px; width: 100%; text-align: center; }
        .btn-pay { width: 100%; background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 10px; font-family: 'Orbitron'; cursor: pointer; }
        .imei-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--neon); padding: 15px; color: var(--neon); border-radius: 12px; text-align: center; margin-bottom: 10px; }
        .btn-send { width: 100%; background: #24a847; color: #fff; border: none; padding: 15px; border-radius: 12px; font-family: 'Orbitron'; cursor: pointer; }
    </style>
</head>
<body>

<div class="page-grid">
    <div class="hud-card">
        <h5>"TOMA EL CONTROL"</h5>
        <div id="versiculo" style="color: var(--gold);"></div>
        <div class="payment-box">
            <button class="btn-pay" onclick="validarAcceso()">[ DATOS BANCARIOS ]</button>
        </div>
    </div>

    <div class="hud-card">
        <div id="product-display"></div>
        <div class="imei-box">
            <input type="text" id="imeiField" class="imei-input" placeholder="INGRESE IMEI (15)" maxlength="15">
            <button class="btn-send" onclick="sendWhatsApp()">[ PROCESAR SOLICITUD ]</button>
        </div>
    </div>
</div>

<div id="modalCuentas" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:rgba(10, 5, 20, 0.95); border: 1px solid var(--gold); padding: 25px; border-radius: 20px;">
        <h5 style="color:var(--gold);">[ DATOS BANCARIOS ]</h5>
        <button onclick="document.getElementById('modalCuentas').style.display='none'">[ CERRAR ]</button>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
